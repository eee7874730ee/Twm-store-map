<title>叫號說 APP</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&family=Archivo+Black&display=swap">
<style>
/* Layout: mobile web page (not an app) in the comic blue world. One column; on desktop it sits in a phone-sized browser frame. 3 tabs: 排隊 / 我的號碼 / 小教室. A 3D cube-head mascot guides at the moment of need. */
:root{
  color-scheme:light;
  --sky:#3a4fd6; --sky-deep:#2a3ab0; --night:#1b2470;
  --ink:#15142a; --paper:#fffaf0; --cream:#fdf0d2;
  --orange:#f2711c; --yellow:#ffcf2e; --green:#3ec46d; --green-deep:#25964f;
  --red:#e8402f; --lilac:#b9bff2; --muted:#5a5c78; --street:#6a6f8f;
  --f-body:"Noto Sans TC",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
  --f-num:"Archivo Black","Noto Sans TC",Impact,sans-serif;
  --line:3px solid var(--ink); --shadow:4px 4px 0 var(--ink);
}
*{box-sizing:border-box}
html,body{height:100%}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{background:var(--night);color:var(--paper);font-family:var(--f-body);font-size:15px;line-height:1.6}
button{font:inherit;cursor:pointer;color:inherit}
a{color:inherit}
button:focus-visible,textarea:focus-visible,select:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
.outer{min-height:100%;display:grid;justify-items:center;align-content:start;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (max-width:480px){.outer{padding:0}}

/* phone-sized browser frame */
.phone{position:relative;transition:transform .55s cubic-bezier(.3,1.2,.5,1);width:min(100%,420px);height:min(880px,calc(100dvh - 28px));min-height:600px;background:var(--sky);border:var(--line);border-radius:30px;box-shadow:6px 6px 0 #000;overflow:hidden;display:flex;flex-direction:column}
@media (max-width:480px){.phone{border:0;border-radius:0;box-shadow:none;height:100dvh;min-height:0}}
.urlbar{background:#e9eaf3;color:#3b3d55;font-size:12px;padding:8px 12px 6px;display:flex;align-items:center;gap:8px;border-bottom:1px solid #c9cbe0}
.urlbar .u{flex:1;min-width:0;background:#fff;border-radius:999px;padding:3px 12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.urlbar .u b{color:var(--ink)}
.appTop{background:var(--ink)}
.appTop .title{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 14px 6px;font-weight:900;font-size:17px}
.storebtn{background:none;border:0;padding:0;color:var(--yellow);font-weight:900;font-size:13px;text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:2px}
.storepick .cities{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.storepick .cities button{flex:none;border:2px solid var(--ink);border-radius:999px;background:#fff;font-size:12px;font-weight:900;padding:2px 10px}
.storepick .cities button[aria-pressed="true"]{background:var(--yellow)}
.storepick .slist{max-height:46vh;overflow:auto;display:grid;gap:6px;margin-top:8px}
.storepick .slist button{display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:left;border:2px solid var(--ink);border-radius:12px;background:#fff;padding:8px 10px;font-weight:900;font-size:14px}
.storepick .slist button[aria-pressed="true"]{background:var(--yellow)}
.storepick .slist .addr{display:block;font-size:11px;color:var(--muted);font-weight:700;margin-top:2px;white-space:normal}
.storepick .slist small{font-size:11px;color:var(--muted);font-weight:700;white-space:nowrap}
.storepick input{width:100%}
.appTop .store{font-weight:900;color:var(--yellow);font-size:13px;display:flex;align-items:center;gap:8px}
.aa{height:28px;padding:0 9px;border-radius:999px;border:2px solid var(--yellow);background:var(--yellow);color:var(--ink);font-weight:900;font-size:14px;line-height:1;flex:none}
.phone.big .aa{background:#fff}
.phone.big .appBody{zoom:1.16}
.billboard .to span{white-space:nowrap}
.phone.big .billboard{padding:6px 10px}
.phone.big .billboard .now{font-size:38px}
.phone.big .billboard .to{font-size:17px}
.phone.big .billboard .to b{font-size:54px}
.phone.big .appTop .title{font-size:19px}
.phone.big .muted,.phone.big .opt small,.phone.big .prep{color:#3d3b55!important}
.phone.big .tabbar button{font-size:15px}
.setrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;border-top:2px dashed #d8d4c8;padding-top:12px}
.setrow b{display:block;font-size:17px}.setrow small{display:block;font-size:13px;color:var(--muted);font-weight:700}
.sw{position:relative;width:54px;height:30px;flex:none}
.sw input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.sw i{position:absolute;inset:0;border:var(--line);border-radius:999px;background:#ddd;pointer-events:none;transition:background .2s}
.sw i::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;border:2px solid var(--ink);transition:transform .2s}
.sw input:checked+i{background:var(--green)}.sw input:checked+i::after{transform:translateX(24px)}
.sw input:focus-visible+i{outline:3px solid var(--yellow);outline-offset:2px}
.langs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.langs button{border:var(--line);border-radius:12px;background:#fff;font-weight:900;font-size:15px;padding:8px;color:var(--ink)}
.langs button[aria-pressed="true"]{background:var(--yellow)}
.help{width:28px;height:28px;border-radius:50%;border:2px solid var(--yellow);background:none;color:var(--yellow);font-weight:900;font-size:14px;line-height:1}
.mq{display:flex;background:var(--yellow);color:var(--ink);border-top:var(--line);border-bottom:var(--line)}
.mq .pin{flex:none;background:var(--orange);color:#fff;font-weight:900;font-size:13px;padding:5px 10px;border-right:var(--line);white-space:nowrap}
.mq .pin b{font-family:var(--f-num);font-size:15px}
.mq .run{overflow:hidden;white-space:nowrap;flex:1;min-width:0;display:flex;align-items:center}
.mqlink{color:var(--ink);text-decoration:underline;text-underline-offset:3px;font-weight:900}
.mq .run .track{display:inline-flex;white-space:nowrap;will-change:transform}
.mq .run .seg{flex:none;font-weight:700;font-size:13px;line-height:1.6;padding-right:2em;-webkit-text-size-adjust:100%}
.appBody{flex:1;overflow-y:auto;overflow-x:hidden;padding:14px 14px 28px;display:grid;grid-template-columns:minmax(0,1fr);gap:18px;align-content:start}
.appBody>*{min-width:0}
.tabbar{display:grid;grid-template-columns:repeat(3,1fr);background:var(--paper);border-top:var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar button{border:0;background:none;color:var(--muted);font-weight:900;font-size:13px;padding:7px 0 9px;display:grid;justify-items:center;position:relative}
.tabbar svg{width:25px;height:25px}
.tabbar button[aria-current="page"]{color:var(--sky-deep)}
.tabbar button[aria-current="page"]::before{content:"";position:absolute;top:-3px;left:30%;right:30%;height:5px;background:var(--orange);border-radius:0 0 4px 4px}
.tabbar .dot{position:absolute;top:4px;left:calc(50% + 7px);min-width:18px;height:18px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;line-height:18px;padding:0 4px;font-family:var(--f-num);border:2px solid var(--paper)}

/* toast (SMS / notice) */
.toast{position:absolute;left:10px;right:10px;top:10px;z-index:48;border:var(--line);border-radius:16px;box-shadow:var(--shadow);padding:10px 12px;color:var(--ink);background:var(--paper);display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:center;animation:drop .35s cubic-bezier(.2,1.4,.4,1)}
@keyframes drop{from{transform:translateY(-140%)}}
.toast.sms{background:#eafbef}
.toast.promo{background:var(--cream)}
.toast .ic{width:38px;height:38px;border-radius:10px;border:2px solid var(--ink);display:grid;place-items:center;font-weight:900;font-size:12px;background:var(--green);color:var(--ink)}
.toast.info .ic{background:var(--yellow)}
.toast.promo .ic{background:var(--lilac)}
.toast small{display:block;font-size:11px;font-weight:900;color:var(--muted)}
.toast b{font-size:15px;display:block;line-height:1.35}
.toast p{margin:2px 0 0;font-size:13px;line-height:1.45}

/* modal */
.modal{position:absolute;inset:0;z-index:40;background:rgba(13,18,64,.74);display:grid;place-items:center;padding:18px;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet{width:100%;max-height:100%;overflow:auto;background:var(--paper);color:var(--ink);border:var(--line);border-radius:22px;box-shadow:6px 6px 0 var(--ink);padding:18px;display:grid;gap:12px}
.sheet.alert{background:var(--yellow);text-align:center;animation:shake .5s 2}
.sheet.called{background:var(--orange);color:#fff;text-align:center;animation:shake .5s 2}
@keyframes shake{20%{transform:rotate(-2deg)}40%{transform:rotate(2deg)}60%{transform:rotate(-1deg)}80%{transform:rotate(1deg)}}
.sheet h3{margin:0;font-size:22px;font-weight:900;line-height:1.3}
.sheet p{margin:0;font-weight:700}
.sheet .big{font-family:var(--f-num);font-size:64px;line-height:1}
.sheet .desk{font-family:var(--f-num);font-size:84px;line-height:1;color:var(--yellow);text-shadow:4px 4px 0 var(--ink)}
.sheet .acts{display:grid;gap:8px}
.sheet label{font-weight:900;font-size:14px;display:grid;gap:4px;text-align:left}
.sheet input[type=text],.sheet input[type=tel]{font:inherit;border:var(--line);border-radius:11px;padding:8px 10px;background:#fff;color:var(--ink)}
.sheet .err{color:var(--red);font-size:13px;font-weight:700;min-height:1.2em;text-align:left}
.sheet .fine{font-size:12px;color:var(--muted);font-weight:500;text-align:left}

/* guide mascot */
.guide{position:absolute;left:10px;right:10px;bottom:74px;z-index:25;display:grid;grid-template-columns:72px minmax(0,1fr);gap:6px;align-items:end;animation:rise .4s cubic-bezier(.2,1.4,.4,1);pointer-events:none}
@keyframes rise{from{transform:translateY(30px);opacity:0}}
.guide .av{width:72px;height:72px;border:var(--line);border-radius:50%;background:var(--orange);overflow:hidden;display:grid;place-items:center;pointer-events:auto}
.guide .av img,.guide .av svg{width:100%;height:100%;object-fit:cover}
.guide .say{position:relative;background:var(--paper);color:var(--ink);border:var(--line);border-radius:16px;box-shadow:var(--shadow);padding:10px 12px;font-weight:700;font-size:14px;line-height:1.5;pointer-events:auto;display:grid;gap:8px}
.guide .say::before{content:"";position:absolute;left:-12px;bottom:14px;width:14px;height:14px;background:var(--paper);border-left:var(--line);border-bottom:var(--line);transform:rotate(45deg)}
.guide .say .row{justify-content:flex-end}

/* shared */
.tagc{display:inline-block;font-size:12px;font-weight:900;padding:1px 8px;border-radius:6px;border:2px solid var(--ink);background:var(--yellow);color:var(--ink);white-space:nowrap}
.tagc.blue{background:var(--sky);color:#fff}.tagc.red{background:var(--red);color:#fff}.tagc.green{background:var(--green)}.tagc.lilac{background:var(--lilac)}.tagc.white{background:#fff}
.h2{display:flex;align-items:center;gap:8px;margin:0;flex-wrap:wrap}
.h2 span{background:var(--orange);color:#fff;border:var(--line);border-radius:9px;box-shadow:2px 2px 0 var(--ink);padding:0 9px;font-weight:900;font-size:12px}
.h2 h2,.h2 h3{margin:0;font-size:19px;font-weight:900;text-shadow:2px 2px 0 var(--ink);text-wrap:balance}
.box{background:var(--paper);color:var(--ink);border:var(--line);border-radius:16px;box-shadow:var(--shadow);padding:14px;display:grid;gap:10px}
.box h4{margin:0;font-size:16px;font-weight:900;line-height:1.4}
.box p{margin:0}
.muted{color:var(--muted);font-size:13px}
.cta{display:block;width:100%;background:var(--yellow);color:var(--ink);border:var(--line);border-radius:14px;box-shadow:var(--shadow);font-size:20px;font-weight:900;padding:12px;letter-spacing:.04em;text-align:center;text-decoration:none}
.cta:active,.btn:active,.cat:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.cta:disabled{opacity:.5;cursor:not-allowed}
.btn{border:var(--line);background:#fff;color:var(--ink);font-weight:900;padding:8px 14px;border-radius:11px;box-shadow:3px 3px 0 var(--ink);font-size:15px;text-decoration:none;display:inline-block;text-align:center}
.btn.dark{background:var(--ink);color:var(--yellow)}
.btn.blue{background:var(--sky);color:#fff}
.btn.sm{font-size:13px;padding:4px 10px}
.btn.wide{width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.linkbtn{border:0;background:none;text-decoration:underline;font-weight:700;padding:0}
.meter{height:12px;border:2px solid var(--ink);border-radius:999px;background:#fff;overflow:hidden}
.meter i{display:block;height:100%;background:var(--green);transition:width .6s}
.meter i.orange{background:var(--orange)}

/* scene (3D) */
.shout{position:relative;background:var(--orange);border:var(--line);border-radius:18px;box-shadow:var(--shadow);padding:10px 16px 12px;color:#fff}
.shout::after{content:"";position:absolute;left:36px;bottom:-18px;width:24px;height:20px;background:var(--orange);border-right:var(--line);border-bottom:var(--line);transform:skewX(-35deg)}
.shout h3{margin:0;font-size:28px;font-weight:900;line-height:1.15;text-shadow:3px 3px 0 var(--ink)}
.shout p{margin:4px 0 0;font-weight:700;font-size:14px}
.scene{position:relative;border:var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden;background:linear-gradient(var(--sky-deep),var(--sky) 70%);height:320px;touch-action:pan-y}
.scene canvas{position:absolute;inset:0;width:100%!important;height:100%!important;display:block;cursor:grab}
.billboard{position:absolute;z-index:3;left:50%;top:10px;transform:translateX(-50%);width:90%;background:var(--cream);color:var(--ink);border:var(--line);border-radius:8px;box-shadow:var(--shadow);padding:6px 12px;display:flex;align-items:center;justify-content:space-between;gap:10px;pointer-events:none}
.billboard small{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:900;color:var(--red)}
.billboard small::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--red);animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.2}}
.billboard .now{font-family:var(--f-num);font-size:44px;line-height:1}
.billboard .now.flip{animation:flipin .45s}
@keyframes flipin{from{transform:rotateX(90deg)}}
.billboard .to{font-weight:900;font-size:20px;text-align:right;line-height:1.1;display:flex;align-items:center;gap:6px}
.billboard .to b{font-family:var(--f-num);font-size:64px;color:var(--orange);line-height:1;-webkit-text-stroke:1.5px var(--ink)}
.scene .hint{position:absolute;z-index:3;right:8px;bottom:8px;font-size:11px;font-weight:700;background:var(--ink);padding:1px 8px;border-radius:6px;pointer-events:none}
.bubble{position:absolute;z-index:4;left:50%;top:88px;transform:translateX(-50%);width:90%;background:var(--paper);color:var(--ink);border:var(--line);border-radius:12px;box-shadow:var(--shadow);padding:8px 10px;font-size:13px;font-weight:700;animation:pop .3s}
.bubble .row{margin-bottom:3px}
.flat{position:absolute;left:0;right:0;bottom:0;height:150px;background:var(--street);border-top:var(--line);overflow-x:auto}
.flat .line{display:flex;align-items:flex-end;gap:2px;padding:30px 12px 6px;width:max-content}
.flat button{border:0;background:none;padding:0;display:grid;justify-items:center}
.flat svg{width:54px;height:84px}
.flat .clerk{display:grid;justify-items:center;margin-right:8px;padding-right:8px;border-right:3px dashed rgba(255,255,255,.5)}
.flat .no{font-family:var(--f-num);font-size:10px;background:var(--ink);color:#fff;padding:0 5px;border-radius:4px}

/* take */
.cats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cat{border:var(--line);background:#fff;color:var(--ink);border-radius:14px;box-shadow:3px 3px 0 var(--ink);padding:10px 10px 8px;display:grid;gap:2px;text-align:left;font-weight:900;font-size:15px;line-height:1.3}
.cat small{font-weight:700;font-size:12px;color:var(--muted)}
.cat small b{font-family:var(--f-num);color:var(--orange);font-size:14px}
.cat[aria-pressed="true"]{background:var(--sky);color:#fff}
.cat[aria-pressed="true"] small{color:#dfe2ff}
.cat[aria-pressed="true"] small b{color:var(--yellow)}
.step{display:grid;gap:8px}
.step .lbl{display:flex;align-items:center;gap:8px;font-weight:900}
.step .lbl i{font-style:normal;font-family:var(--f-num);width:24px;height:24px;border-radius:50%;background:var(--ink);color:var(--yellow);display:grid;place-items:center;font-size:13px}
.step .lbl em{font-style:normal;font-weight:700;font-size:12px;color:var(--muted)}
textarea,input[type=tel]{width:100%;font:inherit;border:var(--line);border-radius:11px;padding:8px 10px;background:#fff;color:var(--ink)}
textarea{resize:none;min-height:72px}
.starters{display:flex;gap:6px;flex-wrap:wrap}
.starters button{border:2px dashed var(--ink);background:none;border-radius:999px;font-size:13px;font-weight:700;padding:3px 10px;color:var(--ink)}
.starters button[aria-pressed="true"]{border-style:solid;background:var(--yellow);font-weight:900}
.chipgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.chipgrid button{width:100%;text-align:left;padding:6px 12px;border-radius:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chiplbl{font-size:12px;font-weight:900;color:var(--muted);margin-top:2px}
.interest{flex:none;cursor:pointer;margin-left:2px;position:relative}
.interest input{position:absolute;left:0;top:0;opacity:0;width:1px;height:1px;margin:0}
.interest span{display:inline-block;border:2px solid #fff;border-radius:999px;padding:0 8px;font-size:11px;font-weight:900;line-height:18px;color:#fff;white-space:nowrap}
.interest input:checked+span{background:var(--yellow);border-color:var(--yellow);color:var(--ink)}
.interest input:focus-visible+span{outline:2px solid var(--yellow);outline-offset:2px}
.picked-say{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--muted)}
.picked-say .linkbtn{color:var(--sky-deep);font-size:14px}
.count{display:flex;justify-content:space-between;align-items:center;gap:8px}
.count span{font-family:var(--f-num);font-size:12px;color:var(--muted)}
.suggest{font-size:13px;font-weight:700;color:var(--sky-deep)}
.notice{background:#e3f7ea;border:2px solid var(--ink);border-radius:12px;padding:10px;font-size:13px;font-weight:700;display:grid;gap:8px}
.notice b{font-size:15px}
.quickgo{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.quickgo .btn{font-size:13px;padding:8px 4px;line-height:1.3}
details.more{border-top:2px dashed #c9cbe0;padding-top:8px}
details.more summary{cursor:pointer;font-weight:900;font-size:14px;color:var(--sky-deep);list-style:none}
details.more summary::before{content:"＋ "}
details.more[open] summary::before{content:"－ "}
.opt{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px;align-items:start;font-size:14px;font-weight:700;margin-top:8px}
.opt input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--sky)}
.opt.prio{background:#fff3e6;border:2px solid var(--orange);border-radius:12px;padding:8px 10px}
.opt small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.stores{display:flex;gap:6px;overflow-x:auto;margin:8px 0 10px;padding-bottom:4px;scrollbar-width:none}
.store-opt{flex:none;text-align:left;border:2px solid var(--ink);border-radius:12px;background:#fff;padding:4px 10px;line-height:1.3}
.store-opt b{display:block;font-size:13px}.store-opt small{font-size:11px;color:var(--muted);font-weight:700}
.store-opt[aria-pressed="true"]{background:var(--yellow);box-shadow:2px 2px 0 var(--ink)}
.peak{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;align-items:end;height:76px}
.peak button{display:block;border:2px solid var(--ink);border-bottom:0;border-radius:4px 4px 0 0;background:var(--lilac);padding:0}
.peak button.now{background:var(--orange)}
.peak button[aria-pressed="true"]{background:var(--sky)}
.peakx{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;font-size:10px;text-align:center;color:var(--muted);font-family:var(--f-num)}
.slots{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.slot{border:var(--line);border-radius:12px;padding:6px;background:#fff;color:var(--ink);font-weight:900;display:grid;justify-items:center;line-height:1.2}
.slot small{font-weight:700;font-size:11px;color:var(--muted)}
.slot[aria-pressed="true"]{background:var(--sky);color:#fff}
.slot[aria-pressed="true"] small{color:#dfe2ff}
.slot:disabled{opacity:.4}

function enqueue(cat,text,o){
  const t={no:(o.prefix||"A")+(o.prefix==="R"?String(S.rnext++).padStart(3,"0"):o.prefix==="P"?String(S.pnext++).padStart(3,"0"):S.next++),cat,text,me:!!o.me,family:o.family||null,prio:!!o.prio};
  if(o.front)S.queue.unshift(t);
  else if(o.prio){const k=S.queue.findIndex(x=>!x.prio&&x.no[0]!=="R");if(k<0)S.queue.push(t);else S.queue.splice(k,0,t)}
  else S.queue.push(t);
  S.total++;return t;
}

/* ================= queue engine ================= */
function tick(){
  if($("#modal").innerHTML)return;
  const cand=[...Array(ONDUTY).keys()].filter(i=>!(S.pauseLeft>0&&i===S.pauseDesk));
  const free=cand.find(i=>!S.serving[i]);let d=free;
  if(d===undefined){const k=cand.indexOf(S.lastDesk);d=cand[(k+1)%cand.length]}
  S.serving[d]=S.queue.shift()||null;S.lastDesk=d;if(S.serving[d])S.lastCalled={no:S.serving[d].no,desk:d};
  if(S.pauseLeft>0&&--S.pauseLeft===0){toast("info",`${S.pauseDesk+1} 號櫃台恢復服務`,"等候時間會再縮短一些。");logMe(`${S.pauseDesk+1} 號櫃台恢復服務`)}
  if(Math.random()<.6){const sd=SEED[Math.floor(Math.random()*SEED.length)];enqueue(sd[0],Math.random()<.5?sd[1]:"",{})}
  if(S.me){
    const st=meState();
    if(S.serving[d]===S.me){calledAlert()}
    else if(st==="waiting"){runScenario();const w=waitFor(S.me);
      if(w.ahead<=3&&!S.me.n3){S.me.n3=true;
        smsNear(w);
        if(U.out)nearAlert();
      }}
  }
  renderApp(true);Q3.sync();
}

function holdMe(){

  S.queue.splice(Math.min(S.queue.length,pos),0,t);t.n3=false;
  toast("info","已幫你往後延 2 組","保留只能用一次。");Q3.sync();

/* ticker: constant, readable speed; two copies loop seamlessly with no blank gap */
let mqX=0,mqLast=0,mqOn=false;const MQ_SPEED=50; // px per second
function startMq(){if(mqOn)return;mqOn=true;requestAnimationFrame(mqStep)}
function mqStep(ts){
  const tr=$("#mqText"),seg=tr&&tr.firstElementChild;
  if(seg){const dt=mqLast?Math.min(.05,(ts-mqLast)/1000):0;mqLast=ts;
    const w=seg.offsetWidth;if(!matchMedia("(prefers-reduced-motion: reduce)").matches)mqX-=MQ_SPEED*dt;
    if(w&&-mqX>=w)mqX+=w;tr.style.transform=`translateX(${mqX}px)`}
  requestAnimationFrame(mqStep);
}

  const list=()=>{const names=q?Object.values(ALL_STORES).flat().filter(n=>n.includes(q)||(STORE_ADDR[n]||"").includes(q)):ALL_STORES[city];
    return names.length?names.map(n=>`<button type="button" data-home="${n}" aria-pressed="${n===HOME}"><span>${n}${n===HOME?"・目前":""}<small class="addr">${STORE_ADDR[n]||""}</small></span><small>${q?cityOf(n)+"・":""}現在約 ${storeWait(n)} 分</small></button>`).join(""):`<p class="muted">找不到「${esc(q)}」，換個關鍵字試試。</p>`};

const PREF={big:store.get("qt-big")==="1",voice:store.get("qt-voice")!=="0",lang:["zh","en","ja","ko","vi","id"].includes(store.get("qt-lang"))?store.get("qt-lang"):"zh"};
function applyBig(){$("#phone").classList.toggle("big",PREF.big)}
const TTS_LANG={zh:"zh-TW",en:"en-US",ja:"ja-JP",ko:"ko-KR",vi:"vi-VN",id:"id-ID"};
function pickVoice(lang){try{const vs=speechSynthesis.getVoices(),l=lang.toLowerCase();return vs.find(v=>v.lang.toLowerCase().replace("_","-")===l)||vs.find(v=>v.lang.toLowerCase().startsWith(l.slice(0,2)))||null}catch(e){return null}}
function say(text,force){if(!PREF.voice&&!force)return;
  if(!("speechSynthesis" in window)||typeof SpeechSynthesisUtterance==="undefined"){if(force)toast("info","這個瀏覽器不支援語音","請改用手機的 Safari 或 Chrome 直接開啟這個網頁。",4200);return}
  try{const ss=window.speechSynthesis;if(ss.speaking||ss.pending)ss.cancel();if(ss.paused)ss.resume();
    const u=new SpeechSynthesisUtterance(text);u.lang=TTS_LANG[PREF.lang]||"zh-TW";const v=pickVoice(u.lang);if(v)u.voice=v;u.rate=PREF.lang==="en"?.95:.92;u.volume=1;
    let started=false;u.onstart=()=>{started=true};
    u.onerror=e=>{if(force&&e.error!=="interrupted"&&e.error!=="canceled")toast("info","語音播放失敗","請改用 Safari 或 Chrome 直接開啟網頁再試一次。",4200)};
    ss.speak(u);
    if(force)setTimeout(()=>{if(!started&&!ss.speaking)toast("info","沒聽到聲音嗎？","請確認手機沒有開靜音（iPhone 側邊靜音鍵）、音量已調高；在 App 內建瀏覽器可能被擋，請用 Safari 或 Chrome 開啟。",6500)},1600)
  }catch(e){if(force)toast("info","語音播放失敗","請改用 Safari 或 Chrome 直接開啟網頁再試一次。",4200)}}
function callLine(no,desk){const L={zh:`${no.replace(/^([A-Z])/,"$1 ")} 號，請到 ${desk} 號櫃台。`,en:`Number ${no}, please go to counter ${desk}.`,ja:`${no} 番の方、${desk} 番窓口へお越しください。`,ko:`${no}번 고객님, ${desk}번 창구로 오세요.`,vi:`Mời khách hàng số ${no}, đến quầy số ${desk}.`,id:`Nomor antrean ${no}, silakan ke loket ${desk}.`}[PREF.lang];return L+" "+L}
function nearLine(n){return {zh:`前面剩 ${n} 組，請回到門市。`,en:`${n} groups ahead of you. Please come back to the store.`,ja:`あと ${n} 組です。お店にお戻りください。`,ko:`앞에 ${n}팀 남았어요. 매장으로 돌아와 주세요.`,vi:`Còn ${n} nhóm phía trước. Mời bạn quay lại cửa hàng.`,id:`Tinggal ${n} grup lagi. Silakan kembali ke toko.`}[PREF.lang]}

function chipHTML(s,label){const on=(U.chips||[]).includes(s);return `<button type="button" data-st="${s}" aria-pressed="${on}" aria-label="${s}">${on?"✓":"+"} ${label||s}</button>`}

function doTake(){

</script>

<!-- ================= 台灣大哥大門市地圖串接（嵌入模式） =================
     放在地圖網站裡（iframe）或網址加 ?embed=1 時：拿掉手機外框與假網址列、改用台灣大哥大配色，
     並依地圖帶來的門市（?store=…&addr=… 或 postMessage {type:"twm-store"}）自動切換門市。
     單獨打開這個網頁時，外觀與功能維持原樣。 -->
<style>
/* 影片檔還沒放進 assets/ 時，顯示「影片準備中」而不是壞掉的播放器 */
.vframe.nomedia video{visibility:hidden}
.vframe.nomedia::after{content:"🎬 影片準備中";position:absolute;inset:0;display:grid;place-items:center;font-weight:900;font-size:14px;color:#fff}
html.embed .outer{padding:0!important;min-height:100%}
html.embed .phone{width:100%!important;height:100dvh!important;min-height:0!important;border:0!important;border-radius:0!important;box-shadow:none!important}
html.embed .urlbar{display:none!important}
html.embed body{background:#2F2E6C}
html.embed{
  --sky:#2F2E6C; --sky-deep:#262560; --night:#1E1D4A;
  --orange:#FF6A00; --yellow:#FFBA0D; --green:#0EAA7D; --green-deep:#0B8A66;
  --red:#F73603; --lilac:#C9C8F5;
}
</style>
<script>
(()=>{
  const inFrame=(()=>{try{return window.top!==window.self}catch(e){return true}})();
  const P=new URLSearchParams(location.search);
  if(inFrame||P.get("embed")==="1")document.documentElement.classList.add("embed");

  /* 地址比對：取「路／街／大道＋段＋巷弄＋號」，國字段數轉數字、臺→台 */
  const CN={"一":1,"二":2,"三":3,"四":4,"五":5,"六":6,"七":7,"八":8,"九":9,"十":10};
  const norm=a=>String(a||"").replace(/臺/g,"台").replace(/\s/g,"").replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-65248)).replace(/([一二三四五六七八九十])段/g,(m,c)=>CN[c]+"段");
  const roadKey=a=>{const m=norm(a).match(/([^市縣區鄉鎮里村]+?(?:路|街|大道))(\d+段)?(\d+巷)?(\d+弄)?(\d+)(?:[之-]\d+)?[、及,]?[\d、及]*號/);return m?[m[1],m[2]||"",m[3]||"",m[4]||"",m[5]].join("|"):""};
  const core=n=>String(n||"").replace(/台灣大哥大|數位生活|myfone|直營|服務中心|特約|旗艦|門市|店|\s/gi,"").replace(/臺/g,"台");
  function match(name,addr){
    const all=Object.values(ALL_STORES).flat();
    const k=roadKey(addr);
    if(k){const hit=all.find(n=>roadKey(STORE_ADDR[n])===k);if(hit)return hit;
      const loose=all.find(n=>{const t=roadKey(STORE_ADDR[n]).split("|");const u=k.split("|");return t[0]===u[0]&&t[1]===u[1]&&t[4]===u[4]});if(loose)return loose}
    const c=core(name);if(c.length>=2){const hit=all.find(n=>{const d=core(n);return d.length>=2&&(c.includes(d)||d.includes(c))});if(hit)return hit}
    return null;
  }
  let last="";
  function pick(st){
    if(!st||!st.name)return;const key=st.name+"|"+(st.addr||"");if(key===last)return;last=key;
    const n=match(st.name,st.addr);
    if(!n){try{toast("info","這間門市尚未開放線上取號",`「${st.name}」不在叫號說的門市清單中，請點上方門市名稱改選。`,3200)}catch(e){}return}
    if(n===HOME)return;
    if(S&&S.me&&["waiting","called"].includes(meState())){try{toast("info",`你正在${HOME}排隊`,"辦完這次的號碼，才能換別的門市。")}catch(e){}return}
    setHome(n);try{fullRender()}catch(e){}
  }
  if(P.get("store"))pick({name:P.get("store"),addr:P.get("addr")||""});
  addEventListener("message",e=>{const d=e.data;if(d&&d.type==="twm-store"&&d.store)pick(d.store)});

  document.addEventListener("error",e=>{const t=e.target;if(t&&t.tagName==="VIDEO"){const f=t.closest(".vframe");if(f)f.classList.add("nomedia")}},true);

  /* 下載 CSV：離開 Claude 後改用瀏覽器一般下載 */
  if(!(window.claude&&claude.use)){
    window.claude={use:async k=>k==="downloads"?{save:async({filename,data})=>{
      const u=URL.createObjectURL(new Blob([data],{type:"text/csv;charset=utf-8"}));const a=document.createElement("a");
      a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000)}}:null};
  }
})();
</script>
